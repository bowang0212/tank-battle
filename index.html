<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101820">
    <title>坦克大战</title>
    <link rel="stylesheet" href="assets/css/style.css">
  </head>
  <body>
    <main class="game">
      <header>
        <h1>坦克大战</h1>
        <div class="stats" aria-live="polite">
          <span>分数 <strong id="score">0</strong></span>
          <span>生命 <strong id="lives">3</strong></span>
          <span>敌军 <strong id="remaining">8</strong></span>
        </div>
      </header>

      <section class="board" aria-label="坦克大战游戏区域">
        <canvas id="game" width="800" height="600" aria-label="使用方向键或 WASD 移动坦克，空格射击"></canvas>
        <div class="message" id="message" hidden>
          <div>
            <h2 id="message-title"></h2>
            <p id="message-text"></p>
          </div>
        </div>
      </section>

      <div class="toolbar">
        <span>移动：WASD / 方向键　射击：空格　暂停：P</span>
        <button id="restart" type="button">重新开始</button>
      </div>
    </main>

    <script type="module" src="assets/js/main.js"></script>
  </body>
</html>
