<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>Tank Battle Pro</title>
  <style>
    :root {
      --bg-1: #09131d;
      --bg-2: #101b2a;
      --panel: rgba(18, 25, 35, 0.8);
      --line: rgba(155, 192, 225, 0.18);
      --text: #edf6ff;
      --muted: #a8bfd3;
      --green: #88f1b5;
      --red: #ff7a7a;
      --gold: #f9d66d;
      --blue: #60c7ff;
      --shadow: rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at top, rgba(59, 92, 155, 0.3), transparent 30%),
                  linear-gradient(180deg, var(--bg-1), var(--bg-2));
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .game-shell {
      width: min(100%, 980px);
      background: rgba(11, 18, 26, 0.78);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.45);
      overflow: hidden;
      backdrop-filter: blur(10px);
    }

    .hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 22px 14px;
      background: linear-gradient(180deg, rgba(18, 24, 35, 0.92), rgba(15, 20, 30, 0.8));
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .brand-mark {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff, #8bf0b5 30%, #1fa767 100%);
      box-shadow: 0 0 18px rgba(139, 240, 181, 0.8);
    }

    .stats {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      color: var(--muted);
      font-size: 0.86rem;
      letter-spacing: 0.04em;
    }

    .stat {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      background: rgba(255,255,255,0.02);
    }

    .stat strong {
      color: var(--text);
      font-size: 1.08rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .board-wrap {
      position: relative;
      padding: 18px;
      background: linear-gradient(180deg, rgba(8, 15, 22, 0.7), rgba(10, 17, 25, 0.9));
    }

    .board {
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      border: 1px solid rgba(173, 200, 233, 0.24);
      background: #0d1724;
      box-shadow: inset 0 0 40px rgba(0,0,0,.28);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: linear-gradient(180deg, rgba(17, 26, 35, 1), rgba(12, 18, 26, 1));
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(7, 12, 18, 0.56);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .panel {
      width: min(90%, 420px);
      padding: 28px 24px 22px;
      border-radius: 18px;
      background: rgba(17, 22, 31, 0.82);
      border: 1px solid rgba(160, 195, 230, 0.18);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .panel h2 {
      margin: 0 0 10px;
      font-size: clamp(1.8rem, 3vw, 2.7rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .panel p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.6;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      appearance: none;
      border: none;
      background: linear-gradient(180deg, #9be7bf, #74d49b);
      color: #0d1d1d;
      font-weight: 800;
      letter-spacing: 0.04em;
      border-radius: 10px;
      padding: 12px 18px;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(116, 212, 155, 0.32);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 20px rgba(116, 212, 155, 0.38);
    }

    .info-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 12px 20px 18px;
      color: var(--muted);
      font-size: 0.88rem;
      border-top: 1px solid rgba(255,255,255,0.06);
      background: rgba(9, 14, 20, 0.6);
    }

    .key {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 7px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text);
      font-weight: 700;
      min-width: 28px;
      text-align: center;
    }

    @media (max-width: 620px) {
      body { padding: 12px; }
      .hud { flex-direction: column; align-items: flex-start; }
      .stats { gap: 8px; }
      .info-bar { flex-direction: column; align-items: flex-start; }
      .panel { width: min(92%, 360px); }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <header class="hud">
      <div class="brand">
        <span class="brand-mark"></span>
        <span>Tank Battle Pro</span>
      </div>

      <div class="stats" aria-live="polite">
        <span class="stat">分数 <strong id="score">0</strong></span>
        <span class="stat">生命 <strong id="lives">3</strong></span>
        <span class="stat">敌军 <strong id="remaining">0</strong></span>
        <span class="stat">波次 <strong id="level">1</strong></span>
      </div>
    </header>

    <div class="board-wrap">
      <div class="board" aria-label="坦克战斗区域">
        <canvas id="game" width="960" height="560" aria-label="游戏区"></canvas>
        <div class="overlay show" id="overlay">
          <div class="panel">
            <h2 id="overlay-title">战役开始</h2>
            <p id="overlay-text">摧毁所有敌方坦克，争取高分。</p>
            <div class="controls">
              <button id="start-btn" type="button">开始游戏</button>
              <button id="restart-btn" type="button" style="background:linear-gradient(180deg,#ffd166,#f4b942); box-shadow: 0 8px 18px rgba(244,185,66,.2)">重新开始</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="info-bar">
      <div>
        操作：<span class="key">WASD</span> / <span class="key">↑↓←→</span>
        &nbsp;&nbsp;射击：<span class="key">Space</span>
        &nbsp;&nbsp;暂停：<span class="key">P</span>
      </div>
      <div id="status">准备就绪</div>
    </div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const livesEl = document.getElementById('lives');
      const remainingEl = document.getElementById('remaining');
      const levelEl = document.getElementById('level');
      const statusEl = document.getElementById('status');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlay-title');
      const overlayText = document.getElementById('overlay-text');
      const startBtn = document.getElementById('start-btn');
      const restartBtn = document.getElementById('restart-btn');

      const W = canvas.width;
      const H = canvas.height;
      const TANK = 28;
      const keys = new Set();

      let player;
      let enemies = [];
      let bullets = [];
      let obstacles = [];
      let pickups = [];
      let effects = [];
      let lastTime = 0;
      let score = 0;
      let lives = 3;
      let wave = 1;
      let shotCooldown = 0;
      let gameStarted = false;
      let paused = false;
      let finished = false;

      const directions = {
        up: { x: 0, y: -1 },
        down: { x: 0, y: 1 },
        left: { x: -1, y: 0 },
        right: { x: 1, y: 0 }
      };

      function rand(min, max) {
        return Math.random() * (max - min) + min;
      }

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function rectsOverlap(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
      }

      function randomChoice(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }

      function makeObstacles() {
        return [
          { x: 135, y: 120, w: 120, h: 28 },
          { x: 705, y: 120, w: 120, h: 28 },
          { x: 430, y: 90, w: 100, h: 24 },
          { x: 90, y: 255, w: 140, h: 28 },
          { x: 730, y: 255, w: 140, h: 28 },
          { x: 410, y: 240, w: 140, h: 28 },
          { x: 150, y: 410, w: 120, h: 28 },
          { x: 690, y: 410, w: 120, h: 28 },
          { x: 430, y: 450, w: 100, h: 24 }
        ];
      }

      function createPlayer() {
        return {
          x: W / 2 - TANK / 2,
          y: H - 60,
          w: TANK,
          h: TANK,
          dir: 'up',
          speed: 190,
          color: '#7ee7b5',
          shield: 0,
          fireCooldown: 0
        };
      }

      function createEnemy(index, level) {
        const cols = 5;
        const xIndex = index % cols;
        const yIndex = Math.floor(index / cols);
        return {
          x: 100 + xIndex * 170 + rand(-18, 18),
          y: 60 + yIndex * 110,
          w: TANK,
          h: TANK,
          dir: randomChoice(['up', 'down', 'left', 'right']),
          speed: 50 + level * 10 + rand(0, 20),
          color: randomChoice(['#ff7a7a', '#ffb26b', '#ff5d73', '#ffc36e']),
          turnTimer: rand(0.8, 1.8),
          fireTimer: rand(1.0, 2.0),
          hp: 1 + (level > 3 ? 1 : 0)
        };
      }

      function hideOverlay() {
        overlay.classList.remove('show');
      }

      function showOverlay(title, text) {
        overlayTitle.textContent = title;
        overlayText.textContent = text;
        overlay.classList.add('show');
      }

      function setStatus(text) {
        statusEl.textContent = text;
      }

      function resetStats() {
        score = 0;
        lives = 3;
        wave = 1;
        scoreEl.textContent = '0';
        livesEl.textContent = '3';
        remainingEl.textContent = '0';
        levelEl.textContent = '1';
        setStatus('准备就绪');
      }

      function beginGame() {
        resetStats();
        finished = false;
        paused = false;
        gameStarted = true;
        obstacles = makeObstacles();
        player = createPlayer();
        enemies = [];
        bullets = [];
        pickups = [];
        effects = [];
        shotCooldown = 0;
        generateWave();
        hideOverlay();
      }

      function generateWave() {
        const total = 5 + wave * 2;
        enemies = [];
        for (let i = 0; i < total; i++) {
          enemies.push(createEnemy(i, wave));
        }
        remainingEl.textContent = String(enemies.length);
        levelEl.textContent = String(wave);
        setStatus('第 ' + wave + ' 波');
      }

      function fireFrom(tank, owner) {
        const d = directions[tank.dir];
        if (!d) return;

        const offset = 16;
        bullets.push({
          x: tank.x + tank.w / 2 - 5 + d.x * offset,
          y: tank.y + tank.h / 2 - 5 + d.y * offset,
          w: 10,
          h: 10,
          dx: d.x,
          dy: d.y,
          speed: owner === 'player' ? 430 : 215 + wave * 12,
          owner,
          life: 2.6
        });
      }

      function blockMove(x, y, w, h) {
        if (x < 0 || y < 0 || x + w > W || y + h > H) return true;
        for (const wall of obstacles) {
          if (rectsOverlap({ x, y, w, h }, wall)) return true;
        }
        return false;
      }

      function canOccupy(tank, x, y) {
        const box = { x, y, w: tank.w, h: tank.h };
        if (blockMove(x, y, tank.w, tank.h)) return false;

        const others = [player, ...enemies].filter(t => t && t !== tank);
        for (const other of others) {
          if (rectsOverlap(box, { x: other.x, y: other.y, w: other.w, h: other.h })) {
            return false;
          }
        }
        return true;
      }

      function moveTank(tank, dx, dy) {
        const nx = tank.x + dx;
        const ny = tank.y + dy;
        if (canOccupy(tank, nx, ny)) {
          tank.x = nx;
          tank.y = ny;
          return true;
        }
        return false;
      }

      function createExplosion(x, y, radius, hue) {
        effects.push({
          x,
          y,
          radius,
          maxRadius: radius * 2.2,
          life: 0.5,
          hue
        });
      }

      function maybeDropPickup(x, y) {
        if (Math.random() > 0.25) return;
        const types = ['shield', 'rapid', 'blast'];
        pickups.push({
          x: x + 6,
          y: y + 6,
          w: 14,
          h: 14,
          type: randomChoice(types),
          pulse: Math.random() * 1000
        });
      }

      function onPlayerHit() {
        if (player.shield > 0) {
          player.shield = 0;
          setStatus('护盾抵挡了一击');
          return;
        }

        lives -= 1;
        livesEl.textContent = String(lives);
        createExplosion(player.x + player.w / 2, player.y + player.h / 2, 20, 195);
        player.x = W / 2 - TANK / 2;
        player.y = H - 60;

        if (lives <= 0) {
          finished = true;
          gameStarted = false;
          setStatus('战役失败');
          showOverlay('失败', `最终得分 ${score}，再来一局。`);
        }
      }

      function handleWaveClear() {
        if (enemies.length > 0) return;
        wave += 1;
        if (wave > 6) {
          finished = true;
          gameStarted = false;
          setStatus('胜利');
          showOverlay('胜利！', `你已打通 6 波，最终得分 ${score}。`);
          return;
        }
        setStatus('波次清空');
        setTimeout(() => {
          if (!finished) generateWave();
        }, 500);
      }

      function updatePlayer(dt) {
        let dx = 0;
        let dy = 0;

        if (keys.has('arrowup') || keys.has('w')) { dy = -1; player.dir = 'up'; }
        else if (keys.has('arrowdown') || keys.has('s')) { dy = 1; player.dir = 'down'; }
        else if (keys.has('arrowleft') || keys.has('a')) { dx = -1; player.dir = 'left'; }
        else if (keys.has('arrowright') || keys.has('d')) { dx = 1; player.dir = 'right'; }

        if (dx || dy) {
          moveTank(player, dx * player.speed * dt, dy * player.speed * dt);
        }

        if (player.shield > 0) {
          player.shield = Math.max(0, player.shield - dt);
        }

        shotCooldown -= dt;
        if (keys.has(' ') && shotCooldown <= 0) {
          fireFrom(player, 'player');
          shotCooldown = 0.26;
        }
      }

      function updateEnemies(dt) {
        enemies.forEach(enemy => {
          enemy.turnTimer -= dt;
          enemy.fireTimer -= dt;

          if (enemy.turnTimer <= 0) {
            enemy.dir = randomChoice(['up', 'down', 'left', 'right']);
            enemy.turnTimer = rand(0.7, 1.6);
          }

          if (enemy.fireTimer <= 0) {
            fireFrom(enemy, 'enemy');
            enemy.fireTimer = rand(1.2, 2.1);
          }

          const d = directions[enemy.dir];
          if (d) {
            const moved = moveTank(enemy, d.x * enemy.speed * dt, d.y * enemy.speed * dt);
            if (!moved) {
              enemy.dir = randomChoice(['up', 'down', 'left', 'right']);
              enemy.turnTimer = 0.4;
            }
          }
        });
      }

      function updateBullets(dt) {
        bullets = bullets.filter(b => {
          b.x += b.dx * b.speed * dt;
          b.y += b.dy * b.speed * dt;
          b.life -= dt;

          if (b.life <= 0 || b.x < -20 || b.y < -20 || b.x > W + 20 || b.y > H + 20) {
            return false;
          }

          if (obstacles.some(wall => rectsOverlap(b, wall))) {
            createExplosion(b.x, b.y, 10, b.owner === 'player' ? 52 : 12);
            return false;
          }

          if (b.owner === 'player') {
            const hit = enemies.find(enemy => rectsOverlap(b, enemy));
            if (hit) {
              hit.hp -= 1;
              if (hit.hp <= 0) {
                const index = enemies.indexOf(hit);
                if (index >= 0) enemies.splice(index, 1);
                score += 100;
                scoreEl.textContent = String(score);
                remainingEl.textContent = String(enemies.length);
                maybeDropPickup(hit.x, hit.y);
                createExplosion(hit.x + hit.w / 2, hit.y + hit.h / 2, 18, 12);
              }
              return false;
            }
          } else if (rectsOverlap(b, player)) {
            onPlayerHit();
            return false;
          }

          return true;
        });
      }

      function updatePickups(dt) {
        pickups = pickups.filter(item => {
          item.y += 0.6 * dt * 60;

          if (rectsOverlap(item, player)) {
            if (item.type === 'shield') {
              player.shield = 8;
              setStatus('护盾已激活');
            } else if (item.type === 'rapid') {
              shotCooldown = Math.max(0, shotCooldown - 0.3);
              setStatus('火力提升');
            } else if (item.type === 'blast') {
              bullets = bullets.filter(b => {
                if (b.owner === 'player') {
                  createExplosion(b.x, b.y, 16, 52);
                  return false;
                }
                return true;
              });
              setStatus('爆裂弹药');
            }
            return false;
          }

          if (item.y > H + 30 || item.x < -30 || item.x > W + 30) return false;
          return true;
        });
      }

      function updateEffects(dt) {
        effects = effects.filter(effect => {
          effect.life -= dt;
          return effect.life > 0;
        });
      }

      function update(dt) {
        if (!gameStarted || paused || finished) return;

        updatePlayer(dt);
        updateEnemies(dt);
        updateBullets(dt);
        updatePickups(dt);
        updateEffects(dt);
        handleWaveClear();
      }

      function drawGrid() {
        ctx.strokeStyle = 'rgba(148, 190, 255, 0.06)';
        ctx.lineWidth = 1;

        for (let x = 0; x <= W; x += 40) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, H);
          ctx.stroke();
        }

        for (let y = 0; y <= H; y += 40) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(W, y);
          ctx.stroke();
        }
      }

      function drawObstacles() {
        obstacles.forEach(wall => {
          const grad = ctx.createLinearGradient(wall.x, wall.y, wall.x + wall.w, wall.y + wall.h);
          grad.addColorStop(0, '#8b5a2b');
          grad.addColorStop(1, '#6d4221');
          ctx.fillStyle = grad;
          ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
          ctx.fillStyle = 'rgba(255,255,255,0.2)';
          ctx.fillRect(wall.x + 4, wall.y + 4, wall.w - 8, 6);
        });
      }

      function drawTank(tank, isPlayer) {
        ctx.save();
        ctx.translate(tank.x + tank.w / 2, tank.y + tank.h / 2);

        const angleMap = { up: 0, right: Math.PI / 2, down: Math.PI, left: -Math.PI / 2 };
        const angle = angleMap[tank.dir] || 0;
        ctx.rotate(angle);

        ctx.fillStyle = '#111f2d';
        ctx.fillRect(-15, -11, 30, 22);

        const body = isPlayer ? '#7ee7b5' : tank.color;
        const accent = isPlayer ? '#e9fffa' : '#fff0f0';
        ctx.fillStyle = body;
        ctx.fillRect(-11, -9, 22, 18);

        ctx.fillStyle = accent;
        ctx.beginPath();
        ctx.arc(0, 0, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = body;
        ctx.fillRect(-3, -18, 6, 18);

        if (isPlayer && player.shield > 0) {
          ctx.strokeStyle = 'rgba(96, 199, 255, 0.9)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(0, 0, 18, 0, Math.PI * 2);
          ctx.stroke();
        }

        ctx.restore();
      }

      function drawBullets() {
        bullets.forEach(b => {
          ctx.fillStyle = b.owner === 'player' ? '#ffe38a' : '#ff7d7d';
          ctx.beginPath();
          ctx.arc(b.x + 5, b.y + 5, 5, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      function drawPickups() {
        pickups.forEach(item => {
          const colors = { shield: '#5cc8ff', rapid: '#ffd166', blast: '#ff7f50' };
          ctx.fillStyle = colors[item.type] || '#fff';
          ctx.fillRect(item.x, item.y, item.w, item.h);
          ctx.strokeStyle = 'rgba(255,255,255,0.5)';
          ctx.strokeRect(item.x + 1.5, item.y + 1.5, item.w - 3, item.h - 3);
        });
      }

      function drawEffects() {
        effects.forEach(effect => {
          const t = 1 - effect.life / 0.5;
          const radius = effect.radius + t * 26;
          ctx.beginPath();
          ctx.strokeStyle = `hsla(${effect.hue}, 90%, 65%, ${Math.max(0, 1 - t)})`;
          ctx.lineWidth = 2;
          ctx.arc(effect.x, effect.y, radius, 0, Math.PI * 2);
          ctx.stroke();
        });
      }

      function drawPlayerStatus() {
        if (player && player.shield > 0) {
          ctx.fillStyle = 'rgba(75, 135, 213, 0.7)';
          ctx.fillRect(18, 18, 120, 12);
          ctx.fillStyle = '#d8f1ff';
          ctx.fillRect(18, 18, (player.shield / 8) * 120, 12);
        }
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = '#111d2b';
        ctx.fillRect(0, 0, W, H);

        drawGrid();
        drawObstacles();
        drawEffects();
        drawPickups();

        if (player) drawTank(player, true);
        enemies.forEach(enemy => drawTank(enemy, false));
        drawBullets();
        drawPlayerStatus();
      }

      function tick(now) {
        const dt = clamp((now - lastTime) / 1000 || 0.016, 0, 0.033);
        lastTime = now;

        update(dt);
        draw();
        requestAnimationFrame(tick);
      }

      startBtn.addEventListener('click', beginGame);
      restartBtn.addEventListener('click', beginGame);

      window.addEventListener('keydown', event => {
        const key = event.key.toLowerCase();
        if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(key) || event.code === 'Space') {
          event.preventDefault();
        }

        if (key === 'p' && gameStarted && !finished) {
          paused = !paused;
          if (paused) {
            showOverlay('暂停', '按 P 继续战斗。');
          } else {
            hideOverlay();
          }
        }

        keys.add(key);
        if (event.code === 'Space') keys.add(' ');
      });

      window.addEventListener('keyup', event => {
        const key = event.key.toLowerCase();
        keys.delete(key);
        keys.delete(' ');
      });

      window.addEventListener('blur', () => keys.clear());

      resetStats();
      showOverlay('战役开始', '摧毁所有敌方坦克，争取高分。');
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
